name: Build Life Arc APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Add icon, tunes, permissions and hardening
        run: |
          mkdir -p android/app/src/main/res/raw && cp resources/raw/*.wav android/app/src/main/res/raw/
          mkdir -p android/app/src/main/java/com/teclipse/lifearc && cp native/*.java android/app/src/main/java/com/teclipse/lifearc/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp resources/icons/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/; done
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#; s#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application android:usesCleartextTraffic="false"#' android/app/src/main/AndroidManifest.xml
      - name: Version number (so a new APK installs over the old one)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Native splash (black screen + logo, no Capacitor default)
        run: |
          R=android/app/src/main/res
          find $R -name 'splash.png' -delete
          cp resources/splash/splash.xml $R/drawable/splash.xml
          mkdir -p $R/drawable-xxhdpi
          cp resources/splash/splash_logo.png resources/splash/splash_icon.png $R/drawable-xxhdpi/
          sed -i 's|<item name="android:background">@drawable/splash</item>|&<item name="windowSplashScreenBackground">@android:color/black</item><item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>|' $R/values/styles.xml
          grep -q windowSplashScreenAnimatedIcon $R/values/styles.xml
      - run: npx cap sync android
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks; PASS="$KS_PASS"
          else
            echo "::warning::KEYSTORE_B64 secret is missing. This APK gets a random key and will NOT install over the old app (you would lose data). Add the secrets from SIGNING-SECRETS.txt."
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore release.jks -alias lifearc -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mohamed Irfan, O=Teclipse, C=IN"
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias lifearc --out LifeArc.apk aligned.apk
          $BT/apksigner verify LifeArc.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Life Arc v1.${{ github.run_number }}
          files: LifeArc.apk
